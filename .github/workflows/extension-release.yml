name: Extension release
on:
  push:
    branches: [main]
    paths:
      - "extension/**"
      - "!extension/release.json"
      - "scripts/build-extension.mjs"
      - "scripts/prepare-extension-release.mjs"
      - "shared/**"
      - "src/components/ui/**"
      - "src/index.css"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/extension-release.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: extension-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate monotonically increasing Chrome version
        id: version
        run: echo "value=$(node scripts/prepare-extension-release.mjs)" >> "$GITHUB_OUTPUT"
      - run: npm test
      - run: npm run build
      - name: Publish extension version metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/release.json
          git commit -m "Release extension $VERSION"
          git push origin HEAD:main
        env:
          VERSION: ${{ steps.version.outputs.value }}
      - name: Publish ZIP and checksums as a GitHub release
        run: |
          gh release create "extension-v$VERSION" dist/extension/tvissn-extension.zip dist/extension/latest.json --target "$(git rev-parse HEAD)" --title "tvissn extension $VERSION" --notes-file extension/RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
